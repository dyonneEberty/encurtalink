<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkFácil — Encurtador de Links</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b border-slate-800/80 bg-slate-950/60 sticky top-0 z-30 backdrop-blur-md">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
          </svg>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white">LinkFácil</h1>
          <p class="text-xs text-slate-400">Encurtador global via API is.gd + QR Code</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="exportData()" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          Exportar
        </button>
        <label class="px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition flex items-center gap-1.5 cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
          </svg>
          Importar
          <input type="file" id="importInput" accept=".json" class="hidden" onchange="importData(event)" />
        </label>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8 space-y-8">

    <!-- Form Card -->
    <section class="glass-card rounded-2xl p-6 shadow-xl">
      <form id="shortenForm" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
          <div class="md:col-span-7">
            <label for="originalUrl" class="block text-xs font-medium text-slate-300 mb-1.5">URL de Destino</label>
            <input
              type="text"
              id="originalUrl"
              placeholder="https://exemplo.com.br/pagina-muito-longa"
              required
              class="w-full px-4 py-3 rounded-xl bg-slate-900/90 border border-slate-700/80 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
            />
          </div>

          <div class="md:col-span-5">
            <label for="customAlias" class="block text-xs font-medium text-slate-300 mb-1.5">
              Apelido personalizado <span class="text-slate-500 font-normal">(opcional, mín. 5 letras/números)</span>
            </label>
            <div class="flex items-center rounded-xl bg-slate-900/90 border border-slate-700/80 focus-within:border-indigo-500 focus-within:ring-1 focus-within:ring-indigo-500 transition overflow-hidden">
              <span class="pl-3.5 pr-1 text-xs text-slate-400 select-none">is.gd/</span>
              <input
                type="text"
                id="customAlias"
                placeholder="lumenDisparo"
                pattern="[a-zA-Z0-9_]{5,30}"
                title="Use entre 5 e 30 caracteres (apenas letras, números ou _)"
                class="w-full py-3 pr-3 bg-transparent text-sm text-white placeholder-slate-500 focus:outline-none"
              />
            </div>
          </div>
        </div>

        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-1">
          <p id="statusMsg" class="text-xs text-slate-400">
            Os links gerados funcionam globalmente para qualquer pessoa.
          </p>
          <button
            type="submit"
            id="submitBtn"
            class="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed text-white text-sm font-semibold shadow-lg shadow-indigo-600/25 transition flex items-center justify-center gap-2"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
            <span id="btnText">Encurtar Link</span>
          </button>
        </div>
      </form>

      <!-- Result Banner -->
      <div id="resultBox" class="hidden mt-6 p-4 rounded-xl bg-emerald-950/40 border border-emerald-500/30 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div class="space-y-0.5 overflow-hidden">
          <span class="text-[11px] uppercase tracking-wider font-semibold text-emerald-400">Link global pronto para compartilhar</span>
          <div class="flex items-center gap-2">
            <a id="generatedLink" href="#" target="_blank" rel="noopener noreferrer" class="text-base font-bold text-white hover:underline truncate"></a>
          </div>
          <p id="generatedOriginal" class="text-xs text-slate-400 truncate"></p>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button onclick="copyLatest()" class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition">
            Copiar Link
          </button>
          <button onclick="openLatestQr()" class="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium border border-slate-700 transition">
            QR Code
          </button>
        </div>
      </div>
    </section>

    <!-- History Section -->
    <section class="space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h2 class="text-base font-semibold text-white">Meus Links Salvos (<span id="linkCount">0</span>)</h2>
          <p class="text-xs text-slate-400">Histórico salvo localmente neste navegador</p>
        </div>

        <div class="relative w-full sm:w-64">
          <input
            type="text"
            id="searchInput"
            placeholder="Buscar por link ou apelido..."
            oninput="renderLinks()"
            class="w-full pl-9 pr-3 py-2 rounded-xl bg-slate-900 border border-slate-800 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"
          />
          <svg class="w-4 h-4 text-slate-500 absolute left-3 top-2.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
      </div>

      <div id="linksList" class="space-y-3"></div>
    </section>
  </main>

  <!-- QR Code Modal -->
  <div id="qrModal" class="fixed inset-0 z-50 hidden bg-black/75 backdrop-blur-sm flex items-center justify-center p-4" onclick="closeQrModal(event)">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 text-center space-y-5 shadow-2xl" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-semibold text-white">QR Code do Link</h3>
        <button onclick="closeQrModal()" class="text-slate-400 hover:text-white text-lg leading-none">×</button>
      </div>
      <div id="qrContainer" class="bg-white p-4 rounded-xl inline-flex items-center justify-center mx-auto"></div>
      <p id="qrUrlText" class="text-xs text-indigo-400 font-medium break-all"></p>
      <div class="flex gap-2">
        <button onclick="downloadQr()" class="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold transition">
          Baixar PNG
        </button>
        <button onclick="closeQrModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium transition">
          Fechar
        </button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 hidden px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white text-xs font-medium shadow-xl"></div>

  <script>
    const STORAGE_KEY = 'linkfacil_global_links_v1';
    let links = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let latestShortUrl = '';
    let currentQrUrl = '';

    function saveLinks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
      renderLinks();
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = `fixed bottom-5 right-5 z-50 px-4 py-2.5 rounded-xl text-xs font-medium shadow-xl border transition ${
        isError
          ? 'bg-red-950/90 border-red-500/40 text-red-200'
          : 'bg-slate-800 border-slate-700 text-white'
      }`;
      toast.classList.remove('hidden');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => toast.classList.add('hidden'), 3200);
    }

    function normalizeUrl(url) {
      let trimmed = url.trim();
      if (!/^https?:\/\//i.test(trimmed)) {
        trimmed = 'https://' + trimmed;
      }
      new URL(trimmed);
      return trimmed;
    }

    // Chamada JSONP para a API do is.gd (evita bloqueios de CORS)
    function shortenViaIsGd(longUrl, customAlias = '') {
      return new Promise((resolve, reject) => {
        const callbackName = 'isgd_cb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
        const script = document.createElement('script');

        const cleanup = () => {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        };

        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error('Tempo limite excedido ao conectar com o servidor is.gd.'));
        }, 12000);

        window[callbackName] = (data) => {
          clearTimeout(timeout);
          cleanup();
          if (data && data.shorturl) {
            resolve(data.shorturl);
          } else if (data && data.errormessage) {
            reject(new Error(data.errormessage));
          } else {
            reject(new Error('Não foi possível encurtar o link.'));
          }
        };

        let apiUrl = `https://is.gd/create.php?format=json&callback=${callbackName}&url=${encodeURIComponent(longUrl)}`;
        if (customAlias) {
          apiUrl += `&shorturl=${encodeURIComponent(customAlias)}`;
        }

        script.src = apiUrl;
        script.onerror = () => {
          clearTimeout(timeout);
          cleanup();
          reject(new Error('Falha de rede ao acessar a API do is.gd.'));
        };

        document.body.appendChild(script);
      });
    }

    document.getElementById('shortenForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const urlInput = document.getElementById('originalUrl');
      const aliasInput = document.getElementById('customAlias');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const statusMsg = document.getElementById('statusMsg');

      let validUrl;
      try {
        validUrl = normalizeUrl(urlInput.value);
      } catch {
        showToast('Por favor, insira uma URL válida.', true);
        return;
      }

      const alias = aliasInput.value.trim();
      if (alias && !/^[a-zA-Z0-9_]{5,30}$/.test(alias)) {
        showToast('O apelido deve ter entre 5 e 30 letras, números ou _.', true);
        return;
      }

      submitBtn.disabled = true;
      btnText.textContent = 'Encurtando...';
      statusMsg.textContent = 'Registrando link curto global...';
      statusMsg.className = 'text-xs text-indigo-400';

      try {
        const shortUrl = await shortenViaIsGd(validUrl, alias);

        const newItem = {
          id: Date.now().toString(),
          shortUrl,
          originalUrl: validUrl,
          createdAt: new Date().toLocaleDateString('pt-BR', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          })
        };

        links.unshift(newItem);
        saveLinks();

        latestShortUrl = shortUrl;
        const resultBox = document.getElementById('resultBox');
        const generatedLink = document.getElementById('generatedLink');
        const generatedOriginal = document.getElementById('generatedOriginal');

        generatedLink.href = shortUrl;
        generatedLink.textContent = shortUrl;
        generatedOriginal.textContent = validUrl;
        resultBox.classList.remove('hidden');

        urlInput.value = '';
        aliasInput.value = '';
        statusMsg.textContent = 'Link gerado com sucesso! Qualquer pessoa pode acessá-lo.';
        statusMsg.className = 'text-xs text-emerald-400';
        showToast('Link global encurtado com sucesso!');
      } catch (err) {
        let errorText = err.message || 'Erro ao encurtar.';
        if (errorText.toLowerCase().includes('already exists')) {
          errorText = 'Este apelido já está em uso no is.gd. Escolha outro nome.';
        }
        statusMsg.textContent = errorText;
        statusMsg.className = 'text-xs text-red-400';
        showToast(errorText, true);
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = 'Encurtar Link';
      }
    });

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('Link copiado para a área de transferência!');
      });
    }

    function copyLatest() {
      if (latestShortUrl) copyText(latestShortUrl);
    }

    function openLatestQr() {
      if (latestShortUrl) openQrModal(latestShortUrl);
    }

    function deleteLink(id) {
      links = links.filter((item) => item.id !== id);
      saveLinks();
      showToast('Link removido do histórico.');
    }

    function renderLinks() {
      const list = document.getElementById('linksList');
      const countEl = document.getElementById('linkCount');
      const query = document.getElementById('searchInput').value.toLowerCase().trim();

      const filtered = links.filter(
        (item) =>
          item.shortUrl.toLowerCase().includes(query) ||
          item.originalUrl.toLowerCase().includes(query)
      );

      countEl.textContent = links.length;

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="glass-card rounded-2xl p-8 text-center text-slate-400 text-sm">
            ${links.length === 0 ? 'Nenhum link encurtado ainda. Cole uma URL acima para começar.' : 'Nenhum resultado encontrado para sua busca.'}
          </div>
        `;
        return;
      }

      list.innerHTML = filtered
        .map(
          (item) => `
          <div class="glass-card rounded-xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4 hover:border-slate-700 transition">
            <div class="space-y-1 overflow-hidden">
              <div class="flex items-center gap-2">
                <a href="${item.shortUrl}" target="_blank" rel="noopener noreferrer" class="text-sm font-semibold text-indigo-400 hover:text-indigo-300 hover:underline truncate">
                  ${item.shortUrl}
                </a>
                <span class="text-[11px] text-slate-500 shrink-0">• ${item.createdAt}</span>
              </div>
              <p class="text-xs text-slate-400 truncate" title="${item.originalUrl}">${item.originalUrl}</p>
            </div>

            <div class="flex items-center gap-2 shrink-0">
              <button onclick="copyText('${item.shortUrl}')" class="px-3 py-1.5 rounded-lg bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 text-xs font-medium transition">
                Copiar
              </button>
              <button onclick="openQrModal('${item.shortUrl}')" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-medium transition">
                QR Code
              </button>
              <button onclick="deleteLink('${item.id}')" title="Excluir" class="p-1.5 rounded-lg bg-slate-800/80 hover:bg-red-950/60 text-slate-400 hover:text-red-400 border border-slate-700/80 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </div>
          </div>
        `
        )
        .join('');
    }

    function openQrModal(url) {
      currentQrUrl = url;
      const container = document.getElementById('qrContainer');
      container.innerHTML = '';
      new QRCode(container, {
        text: url,
        width: 190,
        height: 190,
        colorDark: '#0f172a',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });
      document.getElementById('qrUrlText').textContent = url;
      document.getElementById('qrModal').classList.remove('hidden');
    }

    function closeQrModal() {
      document.getElementById('qrModal').classList.add('hidden');
    }

    function downloadQr() {
      const canvas = document.querySelector('#qrContainer canvas');
      if (!canvas) return;
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = 'qrcode-linkfacil.png';
      a.click();
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(links, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `linkfacil-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            links = imported;
            saveLinks();
            showToast('Backup importado com sucesso!');
          } else {
            showToast('Arquivo JSON inválido.', true);
          }
        } catch {
          showToast('Erro ao ler o arquivo.', true);
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    renderLinks();
  </script>
</body>
</html>
